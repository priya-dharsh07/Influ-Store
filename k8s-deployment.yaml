apiVersion: apps/v1
kind: Deployment
metadata:
  name: influstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influstore
  template:
    metadata:
      labels:
        app: influstore
    spec:
      containers:
        - name: influstore
          image: influstore:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: influstore-env